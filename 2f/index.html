<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unit 2 Ff Chant</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--hue:#E07B39;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;
    background:#FFFDF7;color:#2b2b2b;
    font-family:Andika,"Century Gothic","Didact Gothic",Verdana,sans-serif}
  main{width:min(860px,100%);text-align:center}
  .unit{font-size:clamp(13px,3.4vw,17px);letter-spacing:.14em;text-transform:uppercase;
    color:var(--hue);font-weight:700;margin:0 0 6px}
  h1{margin:0 0 18px;font-size:clamp(40px,12vw,86px);line-height:1;color:var(--hue)}
  .frame{position:relative;aspect-ratio:16/9;width:100%;border-radius:18px;overflow:hidden;
    background:#000;box-shadow:0 14px 34px -18px rgba(0,0,0,.55)}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .soon{display:grid;place-items:center;height:100%;color:#fff;gap:10px;
    background:linear-gradient(160deg,var(--hue),#2b2b2b)}
  .soon b{font-size:clamp(17px,4.6vw,24px)}
  .soon span{font-size:clamp(12px,3.2vw,15px);opacity:.85}
  footer{margin-top:16px;font-size:12px;color:#8b8478}
</style>
</head><body><main>
<p class="unit">Unit 2 &middot; Ff Chant</p>
<h1>Ff</h1>
<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/nHMNlrSBoIU?rel=0&amp;modestbranding=1&amp;playsinline=1"
  title="Unit 2 Ff Chant" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen"
  allowfullscreen loading="lazy"></iframe></div>
<footer>Cube Phonics 1</footer>
</main></body></html>
